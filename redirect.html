<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adicionar ao Calendário</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        text-align: center;
    }
    .container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        max-width: 400px;
        width: 90%;
    }
    .btn {
        display: inline-block;
        background: #007AFF;
        color: white;
        padding: 15px 30px;
        border-radius: 12px;
        text-decoration: none;
        font-size: 18px;
        font-weight: 600;
        margin: 10px 0;
        transition: all 0.3s ease;
        border: none;
        cursor: pointer;
        width: 100%;
    }
    .btn:hover {
        background: #0056CC;
        transform: translateY(-2px);
    }
    .btn-secondary {
        background: #6c757d;
    }
    .btn-secondary:hover {
        background: #545b62;
    }
    .event-info {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 15px;
        margin: 15px 0;
    }
    .instructions {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        padding: 15px;
        margin: 15px 0;
        font-size: 14px;
        text-align: left;
    }
</style>
</head>
<body>
    <div class="container">
        <h1>📅 Adicionar Evento</h1>
        
        <div class="event-info">
            <h3>Agendamento Automático ✅</h3>
            <p>Este é um agendamento automático de teste.</p>
            <p><strong>Data:</strong> 12/10/2025 21:40</p>
        </div>

        <button class="btn" onclick="adicionarCalendario()">
            📱 Adicionar ao Calendário
        </button>
        
        <div class="instructions">
            <strong>Instruções para iPhone:</strong><br>
            1. Clique no botão acima<br>
            2. Toque em "Abrir no Calendário"<br>
            3. Confirme o evento e salve
        </div>

        <div style="margin-top: 20px; font-size: 12px; opacity: 0.7;">
            Se não funcionar, tente abrir em outro navegador (Safari recomendado)
        </div>
    </div>

<script>
function adicionarCalendario() {
    // Conteúdo do arquivo .ics
    const icsContent = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Agendamento//App//EN
BEGIN:VEVENT
UID:20251012T214011Z@agendamento
SUMMARY:Agendamento Automático ✅
DESCRIPTION:Este é um agendamento automático de teste.
DTSTART:20251012T214011Z
DTEND:20251012T224011Z
DTSTAMP:20251012T204011Z
CREATED:20251012T204011Z
LAST-MODIFIED:20251012T204011Z
SEQUENCE:0
STATUS:CONFIRMED
TRANSP:OPAQUE
END:VEVENT
END:VCALENDAR`;

    // Cria blob com tipo MIME específico
    const blob = new Blob([icsContent], { 
        type: 'text/calendar;charset=utf-8;'
    });
    
    // Cria URL
    const url = URL.createObjectURL(blob);
    
    // Para iOS - usa abordagem específica
    if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        // Método 1: Tenta abrir diretamente
        window.location.href = url;
        
        // Método 2: Fallback após 1 segundo
        setTimeout(function() {
            // Cria link invisível e clica
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'evento.ics');
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // Instruções específicas
            setTimeout(function() {
                alert('Se o calendário não abriu automaticamente:\n\n1. Toque no arquivo "evento.ics" que foi baixado\n2. Toque em "Compartilhar"\n3. Escolha "Copiar para Calendário"');
            }, 500);
        }, 1000);
    } else {
        // Para outros dispositivos - download normal
        const link = document.createElement('a');
        link.href = url;
        link.download = 'evento.ics';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    
    // Limpa a URL após um tempo
    setTimeout(function() {
        URL.revokeObjectURL(url);
    }, 30000);
}

// Tenta executar automaticamente em iOS
window.onload = function() {
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const urlParams = new URLSearchParams(window.location.search);
    
    // Se for iOS e não tiver parâmetro de redirecionamento, tenta auto-executar
    if (isIOS && !urlParams.has('auto')) {
        // Adiciona parâmetro para evitar loop
        if (!urlParams.has('executed')) {
            setTimeout(function() {
                window.location.href = window.location.href + '?executed=true';
            }, 100);
        } else {
            setTimeout(adicionarCalendario, 500);
        }
    }
};
</script>
</body>
</html>
