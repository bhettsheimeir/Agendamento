<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abrir Calendário</title>
</head>
<body>
<script>
// Tenta abrir o app de Calendário do iOS
window.location.href = "calshow://";

// Se não abrir em 2 segundos, mostra instruções
setTimeout(function() {
    document.body.innerHTML = `
        <div style="text-align: center; padding: 50px 20px; font-family: -apple-system, sans-serif;">
            <h1>📅 Abrir Calendário</h1>
            <p>Se o Calendário não abriu automaticamente:</p>
            <p>1. Volte para o Telegram</p>
            <p>2. Abra o app Calendário manualmente</p>
            <p>3. Crie o evento com as informações fornecidas</p>
        </div>
    `;
}, 2000);
</script>
</body>
</html>
