<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Adicionar ao Calendário</title>
</head>
<body>
<a href="#" onclick="gerarEvento()">📅 Adicionar ao iPhone</a>
<script>
function gerarEvento() {
    const ics = `BEGIN:VCALENDAR
VERSION:2.0
BEGIN:VEVENT
SUMMARY:Agendamento Automático ✅
DESCRIPTION:Este é um agendamento automático de teste.
DTSTART:20251012T210615Z
DTEND:20251012T220615Z
END:VEVENT
END:VCALENDAR`;
    const blob = new Blob([ics], {type: 'text/calendar'});
    const url = URL.createObjectURL(blob);
    window.location.href = url;
}
</script>
</body>
</html>
