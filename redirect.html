<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Adicionar ao Calendário</title>
</head>
<body>
<h3>Clique para adicionar ao seu calendário</h3>
<!-- Apple Calendar / iOS -->
<a id="apple" href="#" onclick="gerarApple()">📱 iPhone/iPad</a><br><br>
<!-- Google Calendar -->
<a id="google" href="https://www.google.com/calendar/render?action=TEMPLATE&text=Agendamento%20Autom%C3%A1tico%20%E2%9C%85&dates=20251012T204854Z/20251012T214854Z&details=Este%20%C3%A9%20um%20agendamento%20autom%C3%A1tico%20de%20teste." target="_blank">💻 Android/PC (Google)</a>

<script>
function gerarApple() {
    var icsContent = `
BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//MeuSistema//Agendamento//PT-BR
BEGIN:VEVENT
UID:${Date.now()}@meusistema
DTSTAMP:${new Date().toISOString().replace(/-|:|\.\d+/g,"")}
DTSTART:20251012T204854Z
DTEND:20251012T214854Z
SUMMARY:Agendamento Automático ✅
DESCRIPTION:Este é um agendamento automático de teste.
END:VEVENT
END:VCALENDAR
`;
    var blob = new Blob([icsContent], {type: 'text/calendar'});
    var url = URL.createObjectURL(blob);
    window.location.href = url; // abre direto no app Calendar
}
</script>
</body>
</html>
