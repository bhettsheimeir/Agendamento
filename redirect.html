<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adicionar ao Calendário</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f5f5f7;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .container {
        background: white;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        width: 90%;
        text-align: center;
    }
    .btn {
        display: block;
        background: #007AFF;
        color: white;
        padding: 18px 30px;
        border-radius: 12px;
        text-decoration: none;
        font-size: 18px;
        font-weight: 600;
        margin: 15px 0;
        border: none;
        width: 100%;
        cursor: pointer;
    }
    .btn-secondary {
        background: #34C759;
    }
    .event-info {
        background: #f8f9fa;
        border-radius: 12px;
        padding: 20px;
        margin: 20px 0;
        text-align: left;
    }
    .instructions {
        background: #fff3cd;
        border: 1px solid #ffeaa7;
        border-radius: 10px;
        padding: 15px;
        margin: 15px 0;
        font-size: 14px;
        text-align: left;
        color: #856404;
    }
</style>
</head>
<body>
    <div class="container">
        <h1>📅 Adicionar Evento</h1>
        
        <div class="event-info">
            <h3 style="margin: 0 0 10px 0;">Agendamento Automático ✅</h3>
            <p style="margin: 0 0 10px 0;">Este é um agendamento automático de teste.</p>
            <p style="margin: 0;"><strong>Data:</strong> 12/10/2025 21:47</p>
        </div>

        <!-- Método 1: Link direto para Google Calendar (funciona no iPhone) -->
        <a href="https://www.google.com/calendar/render?action=TEMPLATE&text=Agendamento%20Autom%C3%A1tico%20%E2%9C%85&dates=20251012T214710Z/20251012T224710Z&details=Este%20%C3%A9%20um%20agendamento%20autom%C3%A1tico%20de%20teste.&sf=true&output=xml" 
           class="btn">
            📅 Adicionar ao Calendário
        </a>

        <!-- Método 2: Download manual do .ics -->
        <button class="btn btn-secondary" onclick="downloadICS()">
            📥 Baixar Arquivo .ICS
        </button>

        <div class="instructions">
            <strong>Para iPhone:</strong><br>
            1. Use o botão "Adicionar ao Calendário" (recomendado)<br>
            2. Ou baixe o .ICS e compartilhe com o app Calendário
        </div>
    </div>

<script>
function downloadICS() {
    const icsContent = `BEGIN:VCALENDAR
VERSION:2.0
BEGIN:VEVENT
SUMMARY:Agendamento Automático ✅
DESCRIPTION:Este é um agendamento automático de teste.
DTSTART:20251012T214710Z
DTEND:20251012T224710Z
UID:20251012T214710Z@agendamento
DTSTAMP:20251012T204710Z
END:VEVENT
END:VCALENDAR`;

    const blob = new Blob([icsContent], { type: 'text/calendar' });
    const url = URL.createObjectURL(blob);
    
    const link = document.createElement('a');
    link.href = url;
    link.download = 'evento_calendario.ics';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    
    setTimeout(() => {
        URL.revokeObjectURL(url);
        alert('Arquivo baixado! No iPhone:\n\n1. Abra o app Arquivos\n2. Encontre "evento_calendario.ics"\n3. Toque no arquivo\n4. Toque em "Compartilhar"\n5. Escolha "Copiar para Calendário"');
    }, 1000);
}

// Redirecionamento automático para Google Calendar em dispositivos móveis
window.onload = function() {
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if (isMobile) {
        console.log('Dispositivo móvel detectado - Google Calendar é a melhor opção');
    }
};
</script>
</body>
</html>
