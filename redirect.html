<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abrir Calendário</title>
<script>
// Tenta abrir o app de Calendário do iOS imediatamente
function abrirCalendario() {
    window.location.href = "calshow://";
    
    // Fallback: se não abrir em 1 segundo, mostra botão
    setTimeout(function() {
        document.getElementById('fallback').style.display = 'block';
    }, 1000);
}

// Executa automaticamente quando a página carrega
window.onload = function() {
    abrirCalendario();
};
</script>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f5f5f7;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
    }
    .container {
        background: white;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        width: 90%;
    }
    .btn {
        display: inline-block;
        background: #007AFF;
        color: white;
        padding: 15px 30px;
        border-radius: 12px;
        text-decoration: none;
        font-size: 16px;
        font-weight: 600;
        margin: 10px 0;
        border: none;
        cursor: pointer;
    }
    #fallback {
        display: none;
        margin-top: 20px;
    }
</style>
</head>
<body>
    <div class="container">
        <h1>📅 Abrindo Calendário...</h1>
        <p><strong>mobile</strong><br>
        24/02/2026 08:00</p>
        <p>Aguarde enquanto abrimos o app de Calendário do iPhone.</p>
        
        <div id="fallback">
            <p>Se o Calendário não abriu automaticamente, clique no botão abaixo:</p>
            <button class="btn" onclick="abrirCalendario()">
                📱 Tentar Novamente
            </button>
            <p style="margin-top: 15px; font-size: 14px; color: #666;">
                Ou abra o app Calendário manualmente.
            </p>
        </div>
    </div>
</body>
</html>
