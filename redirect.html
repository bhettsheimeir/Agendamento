<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adicionar ao Calendário</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        text-align: center;
    }
    .container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        max-width: 400px;
        width: 90%;
    }
    .btn {
        display: inline-block;
        background: #007AFF;
        color: white;
        padding: 15px 30px;
        border-radius: 12px;
        text-decoration: none;
        font-size: 18px;
        font-weight: 600;
        margin: 10px 0;
        transition: all 0.3s ease;
        border: none;
        cursor: pointer;
        width: 100%;
    }
    .btn:hover {
        background: #0056CC;
        transform: translateY(-2px);
    }
    .btn-secondary {
        background: #6c757d;
    }
    .btn-secondary:hover {
        background: #545b62;
    }
    .event-info {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 15px;
        margin: 15px 0;
    }
</style>
</head>
<body>
    <div class="container">
        <h1>📅 Adicionar Evento</h1>
        
        <div class="event-info">
            <h3>Agendamento Automático ✅</h3>
            <p>Este é um agendamento automático de teste.</p>
            <p><strong>Data:</strong> 12/10/2025 21:31</p>
        </div>

        <button class="btn" onclick="baixarICS()">
            📱 Baixar Arquivo .ICS
        </button>
        
        <a href="https://www.google.com/calendar/render?action=TEMPLATE&text=Agendamento%20Autom%C3%A1tico%20%E2%9C%85&dates=20251012T213120Z/20251012T223120Z&details=Este%20%C3%A9%20um%20agendamento%20autom%C3%A1tico%20de%20teste." class="btn btn-secondary" style="text-decoration: none;">
            📅 Google Calendar
        </a>
        
        <p style="margin-top: 20px; font-size: 14px; opacity: 0.8;">
            <strong>Instruções para iPhone:</strong><br>
            1. Clique em "Baixar Arquivo .ICS"<br>
            2. Abra o arquivo baixado<br>
            3. Toque em "Adicionar ao Calendário"
        </p>
    </div>

<script>
function baixarICS() {
    // Formata as datas
    const dtStart = "20251012T213120Z";
    const dtEnd = "20251012T223120Z";
    
    // Cria o conteúdo do arquivo .ics
    const icsContent = `BEGIN:VCALENDAR
VERSION:2.0
BEGIN:VEVENT
SUMMARY:Agendamento Automático ✅
DESCRIPTION:Este é um agendamento automático de teste.
DTSTART:20251012T213120Z
DTEND:20251012T223120Z
END:VEVENT
END:VCALENDAR`;
    
    // Cria o blob
    const blob = new Blob([icsContent], { type: "text/calendar;charset=utf-8" });
    const url = window.URL.createObjectURL(blob);
    
    // Cria link de download
    const link = document.createElement("a");
    link.href = url;
    link.download = "evento.ics";
    
    // Adiciona ao DOM e clica
    document.body.appendChild(link);
    link.click();
    
    // Remove do DOM e limpa URL
    document.body.removeChild(link);
    setTimeout(() => {
        window.URL.revokeObjectURL(url);
    }, 1000);
    
    // Feedback
    alert("Arquivo baixado! No iPhone, abra o arquivo 'evento.ics' e toque em 'Adicionar ao Calendário'.");
}

// Tenta detectar iOS e dar instruções específicas
window.onload = function() {
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (isIOS) {
        console.log("Dispositivo iOS detectado");
    }
};
</script>
</body>
</html>
