<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adicionar ao Calendário</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        text-align: center;
    }
    .container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        max-width: 400px;
        width: 90%;
    }
    .btn {
        display: inline-block;
        background: #007AFF;
        color: white;
        padding: 15px 30px;
        border-radius: 12px;
        text-decoration: none;
        font-size: 18px;
        font-weight: 600;
        margin: 10px 0;
        transition: all 0.3s ease;
        border: none;
        cursor: pointer;
    }
    .btn:hover {
        background: #0056CC;
        transform: translateY(-2px);
    }
    .event-info {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 15px;
        margin: 15px 0;
    }
</style>
</head>
<body>
    <div class="container">
        <h1>📅 Adicionar Evento</h1>
        
        <div class="event-info">
            <h3>Agendamento Automático ✅</h3>
            <p>Este é um agendamento automático de teste.</p>
            <p><strong>Data:</strong> 12/10/2025 21:23</p>
        </div>

        <button class="btn" onclick="adicionarAoCalendario()">
            📱 Adicionar ao Calendário
        </button>
        
        <p style="margin-top: 20px; font-size: 14px; opacity: 0.8;">
            Clique no botão acima para adicionar este evento ao seu calendário.
        </p>
    </div>

<script>
function adicionarAoCalendario() {
    // Formata as datas para o padrão iCalendar
    const dtStart = "20251012T212338Z";
    const dtEnd = "20251012T222338Z";
    
    // Cria o conteúdo do arquivo .ics
    const icsContent = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "BEGIN:VEVENT",
        "SUMMARY:Agendamento Automático ✅",
        "DESCRIPTION:Este é um agendamento automático de teste.",
        "DTSTART:" + dtStart,
        "DTEND:" + dtEnd,
        "END:VEVENT",
        "END:VCALENDAR"
    ].join("\n");
    
    // Cria o blob e URL
    const blob = new Blob([icsContent], { type: "text/calendar;charset=utf-8" });
    const url = window.URL.createObjectURL(blob);
    
    // Tenta usar a API de download para dispositivos móveis
    if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        // Para iOS - abre em nova aba/window
        window.open(url);
    } else {
        // Para outros dispositivos - download direto
        const link = document.createElement("a");
        link.href = url;
        link.download = "evento.ics";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    
    // Limpa a URL após um tempo
    setTimeout(() => {
        window.URL.revokeObjectURL(url);
    }, 1000);
    
    // Feedback para o usuário
    alert("Evento gerado! Se o download não iniciar automaticamente, verifique sua pasta de downloads ou pop-ups bloqueados.");
}

// Tenta executar automaticamente em alguns dispositivos
window.onload = function() {
    // Se for um dispositivo móvel, pode tentar executar automaticamente
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Opcional: auto-executar após um breve delay
        // setTimeout(adicionarAoCalendario, 500);
    }
};
</script>
</body>
</html>
